name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Android SDK
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip zip wget python3
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          wget -q -O "$RUNNER_TEMP/cmdtools.zip" \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
          unzip -q "$RUNNER_TEMP/cmdtools.zip" -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
            "platforms;android-34" "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: 恢复签名
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "缺少 secret KEYSTORE_BASE64" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > debug.keystore

      - name: 编译
        run: ./build.sh

      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v1.0.${GITHUB_RUN_NUMBER}"
          fi
          gh release create "$TAG" y700-ubuntu.apk \
            --title "Ubuntu ${TAG}" \
            --notes "平板安装包。包名 app.y700.ubuntu。需要 Magisk，并允许「Ubuntu」使用 root。签名在各次 Release 之间保持一致，可以覆盖安装。" \
            --latest
